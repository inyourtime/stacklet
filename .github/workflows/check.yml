name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:typegen
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  deploy-staging:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: cloudflare-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STACKLET_CONFIG: wrangler.remote.local.json
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Prepare staging configuration
        env:
          STAGING_CONFIG_JSON: ${{ secrets.CLOUDFLARE_STAGING_CONFIG }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          for (const key of ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"]) {
            if (!process.env[key]) throw new Error(`Missing staging environment secret: ${key}`);
          }

          if (!process.env.STAGING_CONFIG_JSON) throw new Error("Missing staging environment secret: CLOUDFLARE_STAGING_CONFIG");
          const config = JSON.parse(process.env.STAGING_CONFIG_JSON);
          if (!config.env?.staging) throw new Error("CLOUDFLARE_STAGING_CONFIG must include env.staging");
          writeFileSync(process.env.STACKLET_CONFIG, JSON.stringify(config, null, 2) + "\n", { mode: 0o600 });
          NODE
      - run: pnpm install --frozen-lockfile
      - name: Deploy staging
        run: pnpm deploy:staging
